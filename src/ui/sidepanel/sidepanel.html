<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>whileAI — Broadcast</title>
  <link rel="stylesheet" href="theme.css" />
  <style>
    body { padding: 12px; }
    header { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 10px; }
    header h1 { font-size: 14px; margin: 0; }
    textarea {
      width: 100%; min-height: 74px; resize: vertical; padding: 8px;
      border: 1px solid var(--border); border-radius: 5px;
      background: var(--surface); color: var(--text);
      font-family: var(--sans); font-size: 13px;
    }
    .row { display: flex; gap: 6px; align-items: center; margin-top: 8px; }
    .row > button { flex: 1; }
    .providers { display: flex; flex-wrap: wrap; gap: 6px; margin: 10px 0; }
    .chip {
      display: inline-flex; align-items: center; gap: 5px;
      border: 1px solid var(--border); border-radius: 999px;
      padding: 3px 9px; font-size: 12px; cursor: pointer; user-select: none;
      background: var(--surface);
    }
    .chip input { margin: 0; }
    .opt { display: block; margin: 8px 0; font-size: 12px; cursor: pointer; }
    .opt input { margin-right: 6px; }
    .opt .hint { display: block; margin: 2px 0 0 20px; }
    .chip.broken { border-color: var(--accent); color: var(--accent); }
    section h2 {
      font-size: 10px; text-transform: uppercase; letter-spacing: 0.06em;
      color: var(--text-dim); margin: 14px 0 6px;
    }
    .item {
      border: 1px solid var(--border); border-radius: 5px;
      padding: 8px; margin-bottom: 8px; background: var(--surface);
    }
    .item .text {
      font-size: 12.5px; margin-bottom: 6px; white-space: pre-wrap;
      overflow-wrap: anywhere; max-height: 3.2em; overflow: hidden;
    }
    .runs { display: flex; flex-direction: column; gap: 3px; }
    .run { display: flex; align-items: center; gap: 6px; font-size: 11.5px; }
    .run .name { flex: 1; }
    .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--text-dim); flex: none; }
    .dot.active { background: var(--text); animation: pulse 1.2s ease-in-out infinite; }
    .dot.done { background: #16a34a; }
    .dot.bad { background: var(--accent); }
    @keyframes pulse { 50% { opacity: 0.35; } }
    .item-actions { display: flex; gap: 6px; margin-top: 7px; }
    .item-actions button { font-size: 11px; padding: 2px 7px; }
    .empty { color: var(--text-dim); font-size: 12.5px; }
    .banner {
      border: 1px solid var(--accent); color: var(--accent);
      border-radius: 5px; padding: 7px 9px; font-size: 12px; margin-bottom: 10px;
    }
    .banner button { font-size: 11px; margin-top: 6px; }
    .hint { font-size: 11px; color: var(--text-dim); margin-top: 6px; }
  </style>
</head>
<body>
  <header>
    <h1>whileAI</h1>
    <a href="#" id="open-dashboard" style="font-size:11px">dashboard</a>
  </header>

  <div id="banners"></div>

  <textarea id="prompt" placeholder="Ask every AI at once…" aria-label="Prompt"></textarea>
  <div class="row">
    <button id="send">Send to all</button>
    <button id="show-window" hidden>Show answers</button>
  </div>
  <div class="providers" id="providers"></div>
  <div class="hint" id="hint"></div>

  <section>
    <h2>Capture from a tab</h2>
    <div class="row">
      <button id="set-source">Use the current tab as source</button>
    </div>
    <div class="hint" id="source-state">Off — prompts are only sent from the box above.</div>
  </section>

  <section>
    <h2>Settings</h2>
    <label class="opt"><input type="checkbox" id="opt-keep-history">
      Keep prompt text after a run
      <span class="hint">Off: prompt text is deleted once every provider finishes.</span></label>
    <label class="opt"><input type="checkbox" id="opt-notifications">
      Notify me about sign-in, limits and errors</label>
    <label class="opt"><input type="checkbox" id="opt-new-chat">
      Start a new chat for each prompt
      <span class="hint">Off: prompts continue the existing conversation.</span></label>
    <label class="opt"><input type="checkbox" id="opt-lockstep">
      Wait for every provider before sending the next prompt</label>
    <label class="opt"><input type="checkbox" id="opt-group-tabs">
      Label the answer tabs "whileAI"
      <span class="hint">Groups them so they are easy to tell apart from your own tabs.</span></label>
  </section>

  <section>
    <h2>Queue</h2>
    <div id="queue"><p class="empty">Nothing queued.</p></div>
  </section>

  <script src="sidepanel.js"></script>
</body>
</html>
